<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room 2051 · Seating Chart System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #eef3f8;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
            overflow: hidden; 
            padding: 1rem;
        }

        .chart-container {
            width: 100%;
            max-width: 1600px;
            height: 100%;
            max-height: 900px;
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 20, 40, 0.1);
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #e2eaf3;
            padding-bottom: 0.75rem;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        h1 {
            font-size: 1.5rem;
            color: #0b2b4a;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .class-selector {
            font-size: 1rem;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            border: 2px solid #b8cee4;
            color: #1f4a7a;
            font-weight: 600;
            background: #f4f8fc;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
        }
        .class-selector:focus, .class-selector:hover {
            border-color: #2a6b9e;
            background: white;
        }

        .room-badge {
            background: #e3edf7;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            color: #1f4a7a;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .toolbar-left {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .toolbar-right {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            border: 1px solid #b8cee4;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.9rem;
            background: white;
            color: #1f4a7a;
        }

        .btn:hover { background: #e3edf7; }
        .btn:active { transform: scale(0.98); }

        .btn-primary {
            background: #2a6b9e;
            color: white;
            border-color: #2a6b9e;
        }
        .btn-primary:hover { background: #1f4a7a; border-color: #1f4a7a; }

        .btn-spin {
            background: #f0ad4e;
            color: white;
            border-color: #eea236;
        }
        .btn-spin:hover { background: #ec971f; border-color: #d58512; }

        /* Random Name Display */
        .random-display {
            background: #fff3cd;
            color: #856404;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            border: 1px solid #ffeeba;
            display: none; 
            align-items: center;
            gap: 0.5rem;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* The physical room representation */
        .room-layout {
            flex-grow: 1;
            position: relative;
            background: #fafcff;
            border: 2px dashed #d0dfee;
            border-radius: 0.75rem;
            background-image: 
                linear-gradient(#f0f5fa 1px, transparent 1px),
                linear-gradient(90deg, #f0f5fa 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 0;
            overflow: hidden;
        }

        /* Room Elements */
        .whiteboard {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            background: #e2eaf3;
            color: #5a7a9a;
            width: 25px;
            height: 60%;
            border-radius: 0 10px 10px 0;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 10;
            border: 1px solid #d0dfee;
            border-left: none;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 0;
        }

        .door {
            position: absolute;
            top: 0;
            left: 5%;
            width: 80px;
            height: 25px;
            background: #a0b8d0;
            border-radius: 0 0 5px 5px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .door::before {
            content: 'DOOR';
            font-size: 0.55rem;
            color: white;
            font-weight: 800;
        }
        .door-arc {
            position: absolute;
            top: 0;
            left: 5%;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 1px dashed #a0b8d0;
            border-top: none;
            border-left: none;
            pointer-events: none;
            z-index: 1;
        }

        .desk {
            position: absolute;
            background: white;
            border: 1px solid #b8cee4;
            border-radius: 8px;
            padding: 0.4rem;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s, box-shadow 0.1s;
            aspect-ratio: 1.6 / 1;
            width: 8%; 
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .desk:hover {
            border-color: #2a6b9e;
            box-shadow: 0 4px 12px rgba(42, 107, 158, 0.2);
        }

        .desk.selected {
            border: 2px solid #2a6b9e;
            box-shadow: 0 0 0 3px rgba(42, 107, 158, 0.3);
        }

        .desk.dragging {
            opacity: 0.5;
            transform: translate(-50%, -50%) scale(0.95);
            z-index: 100;
        }

        .desk.drag-over {
            border: 2px dashed #2a6b9e;
            background: #e9f2fc;
            transform: translate(-50%, -50%) scale(1.05);
            z-index: 50;
        }

        .desk.winner {
            animation: winnerPulse 1.5s infinite alternate;
            border-color: #f0ad4e;
            z-index: 20;
        }

        @keyframes winnerPulse {
            from { box-shadow: 0 0 0 0 rgba(240, 173, 78, 0.7); }
            to { box-shadow: 0 0 0 10px rgba(240, 173, 78, 0); }
        }

        .desk-label {
            font-size: 0.55rem;
            color: #6c8199;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 0.1rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .student-name {
            font-weight: 700;
            font-size: 0.85rem;
            color: #1c3a5c;
            line-height: 1.1;
            word-break: break-word;
            width: 100%;
        }

        .zone-top-left { background: #f0f7ff; border-color: #a8c6e8; }
        .zone-top-right { background: #f4fdf4; border-color: #a8e8b0; }
        .zone-bottom { background: #fffaf0; border-color: #e8d8a8; }
        .zone-middle { background: #fdf4ff; border-color: #d8a8e8; }
        .zone-right-col { background: #f0f4f8; border-color: #b0c0d0; }

        .empty-desk {
            background: #f4f7fa;
            border: 1px dashed #b8cee4;
            color: #9bb1c7;
        }
        
        .empty-desk .student-name {
            color: #9bb1c7;
            font-weight: 500;
            font-style: italic;
            font-size: 0.75rem;
        }

        /* POSITIONING */
        .top-1  { top: 18%; left: 15%; width: 7.5%; }
        .top-2  { top: 18%; left: 24%; width: 7.5%; }
        .top-3  { top: 18%; left: 36%; width: 6.5%; }
        .top-4  { top: 18%; left: 43%; width: 6.5%; }
        .top-5  { top: 18%; left: 50%; width: 6.5%; }
        .top-6  { top: 18%; left: 57%; width: 6.5%; }
        .top-7  { top: 18%; left: 64%; width: 6.5%; }
        .top-8  { top: 18%; left: 71%; width: 6.5%; }
        .top-9  { top: 18%; left: 78%; width: 6.5%; }
        .top-10 { top: 18%; left: 85%; width: 6.5%; }

        .right-1 { top: 35%; left: 92%; width: 8.5%; }
        .right-2 { top: 55%; left: 92%; width: 8.5%; }
        .right-3 { top: 75%; left: 92%; width: 8.5%; }

        .mid-1 { top: 40%; left: 42%; width: 8%; }
        .mid-2 { top: 40%; left: 51%; width: 8%; }
        .mid-3 { top: 40%; left: 60%; width: 8%; }
        .mid-4 { top: 60%; left: 42%; width: 8%; }
        .mid-5 { top: 60%; left: 51%; width: 8%; }
        .mid-6 { top: 60%; left: 60%; width: 8%; }

        .bot-1  { top: 85%; left: 10%; width: 7%; }
        .bot-2  { top: 85%; left: 17.5%; width: 7%; }
        .bot-3  { top: 85%; left: 25%; width: 7%; }
        .bot-4  { top: 85%; left: 32.5%; width: 7%; }
        .bot-5  { top: 85%; left: 40%; width: 7%; }
        .bot-6  { top: 85%; left: 47.5%; width: 7%; }
        .bot-7  { top: 85%; left: 55%; width: 7%; }
        .bot-8  { top: 85%; left: 62.5%; width: 7%; }
        .bot-9  { top: 85%; left: 70%; width: 7%; }
        .bot-10 { top: 85%; left: 77.5%; width: 7%; }
        .bot-11 { top: 85%; left: 85%; width: 7%; }

        @media print {
            body { background: white; height: auto; overflow: visible; padding: 0; }
            .chart-container { box-shadow: none; padding: 0; max-width: none; height: auto; }
            .toolbar, .room-badge, .class-selector { display: none !important; }
            header { border-bottom: 2px solid #000; margin-bottom: 10px; }
            h1 { color: #000; }
            .room-layout { border: 2px solid #000; background: none; height: 800px; }
            .desk { box-shadow: none; border: 1px solid #000; background: white !important; color: black !important; }
            .desk-label { color: #000; }
            .student-name { color: #000; font-size: 1rem; }
            .empty-desk { border: 1px dashed #000; }
            .whiteboard, .door, .door-arc { border-color: #000; color: #000; background: white; }
            .random-display { display: none !important; }
        }
    </style>
</head>
<body>
<div class="chart-container">
    <header>
        <div class="header-left">
            <h1>🍎 Seating Chart</h1>
            <select class="class-selector" id="classSelector">
                <optgroup label="Year 7">
                    <option value="7a">Class 7A</option>
                    <option value="7b">Class 7B</option>
                    <option value="7c">Class 7C</option>
                </optgroup>
                <optgroup label="Year 8">
                    <option value="8a">Class 8A</option>
                    <option value="8b">Class 8B</option>
                    <option value="8c">Class 8C</option>
                </optgroup>
                <optgroup label="Year 9">
                    <option value="9a">Class 9A</option>
                    <option value="9b">Class 9B</option>
                    <option value="9c">Class 9C</option>
                </optgroup>
                <optgroup label="Year 10">
                    <option value="10">Class 10</option>
                </optgroup>
                <optgroup label="Year 11">
                    <option value="11sl">Class 11SL</option>
                    <option value="11hl">Class 11HL</option>
                </optgroup>
                <optgroup label="Year 12">
                    <option value="12sl">Class 12SL</option>
                    <option value="12hl">Class 12HL</option>
                </optgroup>
            </select>
        </div>
        <span class="room-badge">🚪 Room 2051</span>
    </header>

    <div class="toolbar">
        <div class="toolbar-left">
            <button class="btn btn-spin" id="spinBtn">🎲 Random Student</button>
            <div class="random-display" id="randomDisplay">
                <span>👉</span> <span id="randomNameText">Name</span>
            </div>
        </div>
        <div class="toolbar-right">
            <button class="btn" id="undoBtn" title="Undo last move">↶ Undo</button>
            <button class="btn" id="printBtn" title="Print Chart">🖨️ Print</button>
            <button class="btn btn-primary" id="resetBtn" title="Reset to default">↻ Reset</button>
        </div>
    </div>

    <div class="room-layout" id="seatingGrid">
        <div class="door"></div>
        <div class="door-arc"></div>
        <div class="whiteboard">Whiteboard</div>
    </div>
</div>

<script>

    // Since I don't have the actual names for the other 15 classes,

    function formatName(fullName) {
        const parts = fullName.trim().split(/\s+/);
        return parts.length > 1 ? `${parts[0]} ${parts[parts.length - 1][0]}.` : parts[0];
    }

    const DESKS = [
        { id: 'ISR-01', pos: 'top-1', zone: 'zone-top-left' }, { id: 'ISR-02', pos: 'top-2', zone: 'zone-top-left' },
        { id: 'ISR-04', pos: 'top-3', zone: 'zone-top-right' }, { id: 'ISR-13', pos: 'top-4', zone: 'zone-top-right' },
        { id: 'ISR-06', pos: 'top-5', zone: 'zone-top-right' }, { id: 'ISR-07', pos: 'top-6', zone: 'zone-top-right' },
        { id: 'ISR-08', pos: 'top-7', zone: 'zone-top-right' }, { id: 'ISR-09', pos: 'top-8', zone: 'zone-top-right' },
        { id: 'ISR-05', pos: 'top-9', zone: 'zone-top-right' }, { id: 'ISR-03', pos: 'top-10', zone: 'zone-top-right' },
        { id: 'ISR-11', pos: 'right-1', zone: 'zone-right-col' }, { id: 'ISR-12', pos: 'right-2', zone: 'zone-right-col' },
        { id: 'ISR-10', pos: 'right-3', zone: 'zone-right-col' },
        { id: 'ISR-27', pos: 'bot-1', zone: 'zone-bottom' }, { id: 'ISR-28', pos: 'bot-2', zone: 'zone-bottom' },
        { id: 'ISR-29', pos: 'bot-3', zone: 'zone-bottom' }, { id: 'ISR-30', pos: 'bot-4', zone: 'zone-bottom' },
        { id: 'ISR-31', pos: 'bot-5', zone: 'zone-bottom' }, { id: 'ISR-32', pos: 'bot-6', zone: 'zone-bottom' },
        { id: 'ISR-33', pos: 'bot-7', zone: 'zone-bottom' }, { id: 'ISR-34', pos: 'bot-8', zone: 'zone-bottom' },
        { id: 'ISR-35', pos: 'bot-9', zone: 'zone-bottom' }, { id: 'ISR-36', pos: 'bot-10', zone: 'zone-bottom' },
        { id: 'ISR-37', pos: 'bot-11', zone: 'zone-bottom' },
        { id: 'ISR-40', pos: 'mid-1', zone: 'zone-middle' }, { id: 'ISR-41', pos: 'mid-2', zone: 'zone-middle' },
        { id: 'ISR-42', pos: 'mid-3', zone: 'zone-middle' }, { id: 'ISR-43', pos: 'mid-4', zone: 'zone-middle' },
        { id: 'ISR-44', pos: 'mid-5', zone: 'zone-middle' }, { id: 'ISR-45', pos: 'mid-6', zone: 'zone-middle' }
    ];

    const STORAGE_KEY_PREFIX = 'room2051_seating_';
    let currentClass = '7a';
    let layout = [];
    let history = []; 
    let selectedIndex = null;

    function getDefaultLayout(className) {
        const rawNames = CLASS_DATA[className] || [];
        const names = rawNames.map(formatName);
        const defaultLayout = DESKS.map(d => ({ ...d, student: null })); 
        const fillOrder = [
            'top-1', 'top-2', 'top-3', 'top-4', 'top-5', 'top-6', 'top-7', 'top-8', 'top-9', 'top-10',
            'bot-1', 'bot-2', 'bot-3', 'bot-4', 'bot-5', 'bot-6', 'bot-7', 'bot-8', 'bot-9', 'bot-10', 'bot-11',
            'right-1', 'right-2', 'right-3',
            'mid-1', 'mid-2', 'mid-3', 'mid-4', 'mid-5', 'mid-6'
        ];
        let nameIndex = 0;
        fillOrder.forEach(pos => {
            if (nameIndex < names.length) {
                const desk = defaultLayout.find(d => d.pos === pos);
                if (desk) { desk.student = names[nameIndex++]; }
            }
        });
        return defaultLayout;
    }

    function loadLayout(className) {
        const saved = localStorage.getItem(STORAGE_KEY_PREFIX + className);
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (parsed.length === DESKS.length && parsed.every((p, i) => p.pos === DESKS[i].pos)) {
                    return parsed;
                }
            } catch (e) {}
        }
        return getDefaultLayout(className);
    }

    function saveState() {
        localStorage.setItem(STORAGE_KEY_PREFIX + currentClass, JSON.stringify(layout));
    }

    function renderGrid() {
        const grid = document.getElementById('seatingGrid');
        const desks = grid.querySelectorAll('.desk');
        desks.forEach(d => d.remove());

        layout.forEach((desk, index) => {
            const el = document.createElement('div');
            el.className = `desk ${desk.zone} ${desk.pos}`;
            if (!desk.student) el.classList.add('empty-desk');
            if (selectedIndex === index) el.classList.add('selected');
            
            el.dataset.index = index;
            el.draggable = true;

            el.innerHTML = `
                <div class="desk-label">${desk.id}</div>
                <div class="student-name">${desk.student || 'Empty'}</div>
            `;

            el.addEventListener('dragstart', (e) => {
                if(selectedIndex !== null) {
                    document.querySelectorAll('.desk').forEach(d => d.classList.remove('selected'));
                    selectedIndex = null;
                }
                el.classList.add('dragging');
                e.dataTransfer.setData('text/plain', index);
            });

            el.addEventListener('dragend', () => {
                el.classList.remove('dragging');
                document.querySelectorAll('.desk').forEach(d => d.classList.remove('drag-over'));
            });

            el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('drag-over'); });
            el.addEventListener('dragleave', () => el.classList.remove('drag-over'));

            el.addEventListener('drop', (e) => {
                e.preventDefault();
                el.classList.remove('drag-over');
                const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
                const toIndex = index;
                if (fromIndex === toIndex) return;
                history.push(JSON.parse(JSON.stringify(layout))); 
                swapStudents(fromIndex, toIndex);
            });

            el.addEventListener('click', () => {
                if (selectedIndex === null) {
                    selectedIndex = index;
                    renderGrid();
                } else {
                    if (selectedIndex === index) {
                        selectedIndex = null;
                        renderGrid();
                    } else {
                        history.push(JSON.parse(JSON.stringify(layout))); 
                        swapStudents(selectedIndex, index);
                        selectedIndex = null;
                    }
                }
            });

            grid.appendChild(el);
        });
    }

    function swapStudents(fromIdx, toIdx) {
        const temp = layout[fromIdx].student;
        layout[fromIdx].student = layout[toIdx].student;
        layout[toIdx].student = temp;
        saveState();
        renderGrid();
        document.getElementById('randomDisplay').style.display = 'none';
    }

    function init() {
        currentClass = document.getElementById('classSelector').value;
        layout = loadLayout(currentClass);
        renderGrid();

        document.getElementById('classSelector').addEventListener('change', (e) => {
            currentClass = e.target.value;
            layout = loadLayout(currentClass);
            history = []; // Clear undo history on class switch
            selectedIndex = null;
            document.getElementById('randomDisplay').style.display = 'none';
            renderGrid();
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            if (confirm('Reset all students to original layout for this class? Unsaved changes will be lost.')) {
                history.push(JSON.parse(JSON.stringify(layout)));
                layout = getDefaultLayout(currentClass);
                saveState();
                selectedIndex = null;
                renderGrid();
            }
        });

        document.getElementById('undoBtn').addEventListener('click', () => {
            if (history.length > 0) {
                layout = history.pop();
                saveState();
                selectedIndex = null;
                renderGrid();
            } else {
                alert('Nothing to undo.');
            }
        });

        document.getElementById('printBtn').addEventListener('click', () => {
            window.print();
        });

        document.getElementById('spinBtn').addEventListener('click', () => {
            const populatedIndices = layout.map((d, i) => d.student ? i : null).filter(i => i !== null);
            if (populatedIndices.length === 0) return;

            document.querySelectorAll('.desk').forEach(d => d.classList.remove('winner'));
            const randomIdx = populatedIndices[Math.floor(Math.random() * populatedIndices.length)];
            const studentName = layout[randomIdx].student;
            const deskEl = document.querySelector(`.desk[data-index="${randomIdx}"]`);
            
            if (deskEl) {
                deskEl.classList.add('winner');
                deskEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            const display = document.getElementById('randomDisplay');
            document.getElementById('randomNameText').innerText = studentName;
            display.style.display = 'flex';

            setTimeout(() => { if(deskEl) deskEl.classList.remove('winner'); }, 4000);
        });
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
