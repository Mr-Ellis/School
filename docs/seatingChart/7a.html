<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room 2051 · Class 7A Seating Chart</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #eef3f8;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
            overflow: hidden; 
            padding: 1rem;
        }

        .chart-container {
            width: 100%;
            max-width: 1600px;
            height: 100%;
            max-height: 900px;
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 20, 40, 0.1);
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #e2eaf3;
            padding-bottom: 0.75rem;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        h1 {
            font-size: 1.6rem;
            color: #0b2b4a;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .room-badge {
            background: #e3edf7;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            color: #1f4a7a;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        .instructions {
            font-weight: 500;
            color: #4a6a8a;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
        }

        .btn {
            border: 1px solid #b8cee4;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-reset {
            background: white;
            color: #1f4a7a;
        }
        .btn-reset:hover { background: #1f4a7a; color: white; }

        .btn-set {
            background: #2a6b9e;
            color: white;
            border-color: #2a6b9e;
        }
        .btn-set:hover { background: #1f4a7a; border-color: #1f4a7a; }

        /* The physical room representation */
        .room-layout {
            flex-grow: 1;
            position: relative;
            background: #fafcff;
            border: 2px dashed #d0dfee;
            border-radius: 0.75rem;
            background-image: 
                linear-gradient(#f0f5fa 1px, transparent 1px),
                linear-gradient(90deg, #f0f5fa 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 0;
            overflow: hidden;
        }

        /* Room Elements */
        .whiteboard {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            background: #e2eaf3;
            color: #5a7a9a;
            padding: 0.3rem 4rem;
            border-radius: 0 0 10px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 10;
            border: 1px solid #d0dfee;
            border-top: none;
        }

        .door {
            position: absolute;
            bottom: 0;
            left: 2%;
            width: 80px;
            height: 8px;
            background: #a0b8d0;
            border-radius: 5px 5px 0 0;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        .door::before {
            content: 'DOOR';
            font-size: 0.55rem;
            color: white;
            font-weight: 800;
            margin-bottom: 1px;
        }
        .door-arc {
            position: absolute;
            bottom: 0;
            left: 2%;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 1px dashed #a0b8d0;
            border-bottom: none;
            border-right: none;
            pointer-events: none;
            z-index: 1;
        }

        .desk {
            position: absolute;
            background: white;
            border: 1px solid #b8cee4;
            border-radius: 8px;
            padding: 0.4rem;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: grab;
            user-select: none;
            transition: transform 0.1s, box-shadow 0.1s;
            aspect-ratio: 1.6 / 1;
            width: 8%; 
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .desk:active {
            cursor: grabbing;
        }

        .desk.dragging {
            opacity: 0.5;
            transform: translate(-50%, -50%) scale(0.95);
            z-index: 100;
        }

        .desk.drag-over {
            border: 2px dashed #2a6b9e;
            background: #e9f2fc;
            transform: translate(-50%, -50%) scale(1.05);
            z-index: 50;
        }

        .desk-label {
            font-size: 0.55rem;
            color: #6c8199;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 0.1rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .student-name {
            font-weight: 700;
            font-size: 0.85rem;
            color: #1c3a5c;
            line-height: 1.1;
            word-break: break-word;
            width: 100%;
        }

        /* Color Coding Zones */
        .zone-top-left { background: #f0f7ff; border-color: #a8c6e8; }
        .zone-top-right { background: #f4fdf4; border-color: #a8e8b0; }
        .zone-bottom { background: #fffaf0; border-color: #e8d8a8; }
        .zone-middle { background: #fdf4ff; border-color: #d8a8e8; }
        .zone-right-col { background: #f0f4f8; border-color: #b0c0d0; }

        .empty-desk {
            background: #f4f7fa;
            border: 1px dashed #b8cee4;
            color: #9bb1c7;
        }
        
        .empty-desk .student-name {
            color: #9bb1c7;
            font-weight: 500;
            font-style: italic;
            font-size: 0.75rem;
        }

        /* =========================================
           EXACT PHYSICAL POSITIONING 
           ========================================= */

        /* --- TOP ROW (10 desks) --- */
        .top-1  { top: 18%; left: 15%; width: 7.5%; }
        .top-2  { top: 18%; left: 24%; width: 7.5%; }
        
        .top-3  { top: 18%; left: 36%; width: 6.5%; }
        .top-4  { top: 18%; left: 43%; width: 6.5%; }
        .top-5  { top: 18%; left: 50%; width: 6.5%; }
        .top-6  { top: 18%; left: 57%; width: 6.5%; }
        .top-7  { top: 18%; left: 64%; width: 6.5%; }
        .top-8  { top: 18%; left: 71%; width: 6.5%; }
        .top-9  { top: 18%; left: 78%; width: 6.5%; }
        .top-10 { top: 18%; left: 85%; width: 6.5%; }

        /* --- RIGHT COLUMN (3 desks) --- */
        .right-1 { top: 35%; left: 92%; width: 8.5%; }
        .right-2 { top: 55%; left: 92%; width: 8.5%; }
        .right-3 { top: 75%; left: 92%; width: 8.5%; }

        /* --- MIDDLE ISLAND (6 desks) --- */
        .mid-1 { top: 40%; left: 42%; width: 8%; }
        .mid-2 { top: 40%; left: 51%; width: 8%; }
        .mid-3 { top: 40%; left: 60%; width: 8%; }
        
        .mid-4 { top: 60%; left: 42%; width: 8%; }
        .mid-5 { top: 60%; left: 51%; width: 8%; }
        .mid-6 { top: 60%; left: 60%; width: 8%; }

        /* --- BOTTOM ROW (11 desks) --- */
        .bot-1  { top: 85%; left: 10%; width: 7%; }
        .bot-2  { top: 85%; left: 17.5%; width: 7%; }
        .bot-3  { top: 85%; left: 25%; width: 7%; }
        .bot-4  { top: 85%; left: 32.5%; width: 7%; }
        .bot-5  { top: 85%; left: 40%; width: 7%; }
        .bot-6  { top: 85%; left: 47.5%; width: 7%; }
        .bot-7  { top: 85%; left: 55%; width: 7%; }
        .bot-8  { top: 85%; left: 62.5%; width: 7%; }
        .bot-9  { top: 85%; left: 70%; width: 7%; }
        .bot-10 { top: 85%; left: 77.5%; width: 7%; }
        .bot-11 { top: 85%; left: 85%; width: 7%; }

    </style>
</head>
<body>
<div class="chart-container">
    <header>
        <h1>🍎 Class 7A · Seating Chart</h1>
        <span class="room-badge">🚪 Room 2051</span>
    </header>

    <div class="toolbar">
        <div class="instructions">🖱️ Drag to arrange, then click <strong>Set Layout</strong> to save.</div>
        <div class="btn-group">
            <button class="btn btn-reset" id="resetBtn">↻ Reset Layout</button>
            <button class="btn btn-set" id="setBtn">💾 Set Layout</button>
        </div>
    </div>

    <div class="room-layout" id="seatingGrid">
        <!-- Room Features -->
        <div class="whiteboard">Whiteboard / Front of Room</div>
        <div class="door">Door</div>
        <div class="door-arc"></div>
        
        <!-- Desks are generated via JS -->
    </div>
</div>

<script>
    const RAW_STUDENTS = [
        "Anirudh Anandasundararaman",
        "Batu Boylu",
        "Mila Chen",
        "Charles Dingendorf",
        "Iris Ho",
        "Alisa Hu",
        "Philian Kampmann",
        "Don Li",
        "Liam Langensiepen",
        "Junchi Liu",
        "Felicia Ljungqvist",
        "Kaan Özcan",
        "Mert Öztürk",
        "Kai Penka",
        "Maximilian Schmidt",
        "Mirtó Simiantonakis",
        "Max Sun",
        "Constantin Volberg",
        "Joshua Wagenfeld",
        "Anqing Xiang",
        "Joan Yan",
        "Minghan Ye",
        "Qianyu Zhan",
        "Emma Zhang"
    ];

    // Format Names: First Name + Last Initial
    function formatName(fullName) {
        const parts = fullName.trim().split(/\s+/);
        if (parts.length > 1) {
            return `${parts[0]} ${parts[parts.length - 1][0]}.`;
        }
        return parts[0];
    }

    // Exact physical mapping based on screenshot
    const DESKS = [
        // TOP ROW (10 desks)
        { id: 'ISR-01', pos: 'top-1', zone: 'zone-top-left' },
        { id: 'ISR-02', pos: 'top-2', zone: 'zone-top-left' },
        { id: 'ISR-04', pos: 'top-3', zone: 'zone-top-right' },
        { id: 'ISR-13', pos: 'top-4', zone: 'zone-top-right' },
        { id: 'ISR-06', pos: 'top-5', zone: 'zone-top-right' },
        { id: 'ISR-07', pos: 'top-6', zone: 'zone-top-right' },
        { id: 'ISR-08', pos: 'top-7', zone: 'zone-top-right' },
        { id: 'ISR-09', pos: 'top-8', zone: 'zone-top-right' },
        { id: 'ISR-05', pos: 'top-9', zone: 'zone-top-right' },
        { id: 'ISR-03', pos: 'top-10', zone: 'zone-top-right' },

        // RIGHT COLUMN (3 desks)
        { id: 'ISR-11', pos: 'right-1', zone: 'zone-right-col' },
        { id: 'ISR-12', pos: 'right-2', zone: 'zone-right-col' },
        { id: 'ISR-10', pos: 'right-3', zone: 'zone-right-col' },

        // BOTTOM ROW (11 desks)
        { id: 'ISR-27', pos: 'bot-1', zone: 'zone-bottom' },
        { id: 'ISR-28', pos: 'bot-2', zone: 'zone-bottom' },
        { id: 'ISR-29', pos: 'bot-3', zone: 'zone-bottom' },
        { id: 'ISR-30', pos: 'bot-4', zone: 'zone-bottom' },
        { id: 'ISR-31', pos: 'bot-5', zone: 'zone-bottom' },
        { id: 'ISR-32', pos: 'bot-6', zone: 'zone-bottom' },
        { id: 'ISR-33', pos: 'bot-7', zone: 'zone-bottom' },
        { id: 'ISR-34', pos: 'bot-8', zone: 'zone-bottom' },
        { id: 'ISR-35', pos: 'bot-9', zone: 'zone-bottom' },
        { id: 'ISR-36', pos: 'bot-10', zone: 'zone-bottom' },
        { id: 'ISR-37', pos: 'bot-11', zone: 'zone-bottom' },

        // MIDDLE ISLAND (6 desks)
        { id: 'ISR-40', pos: 'mid-1', zone: 'zone-middle' },
        { id: 'ISR-41', pos: 'mid-2', zone: 'zone-middle' },
        { id: 'ISR-42', pos: 'mid-3', zone: 'zone-middle' },
        { id: 'ISR-43', pos: 'mid-4', zone: 'zone-middle' },
        { id: 'ISR-44', pos: 'mid-5', zone: 'zone-middle' },
        { id: 'ISR-45', pos: 'mid-6', zone: 'zone-middle' },
    ];

    const STORAGE_KEY = 'room2051_seating_v6';
    
    // We keep a copy of the "active" layout and a copy of the "saved" layout
    let layout = [];
    let savedLayout = null;

    // Fill order: Top (10), Bottom (11), Right (3). Total = 24. 
    // Middle (6) is left empty.
    function getDefaultLayout() {
        const names = RAW_STUDENTS.map(formatName);
        const defaultLayout = DESKS.map(d => ({ ...d, student: null })); 

        const fillOrder = [
            'top-1', 'top-2', 'top-3', 'top-4', 'top-5', 'top-6', 'top-7', 'top-8', 'top-9', 'top-10',
            'bot-1', 'bot-2', 'bot-3', 'bot-4', 'bot-5', 'bot-6', 'bot-7', 'bot-8', 'bot-9', 'bot-10', 'bot-11',
            'right-1', 'right-2', 'right-3',
            'mid-1', 'mid-2', 'mid-3', 'mid-4', 'mid-5', 'mid-6'
        ];

        let nameIndex = 0;
        fillOrder.forEach(pos => {
            if (nameIndex < names.length) {
                const desk = defaultLayout.find(d => d.pos === pos);
                if (desk) {
                    desk.student = names[nameIndex];
                    nameIndex++;
                }
            }
        });

        return defaultLayout;
    }

    // Load from localStorage if it exists, otherwise use default
    function loadInitialLayout() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (parsed.length === DESKS.length) {
                    const isValid = parsed.every((p, i) => p.pos === DESKS[i].pos);
                    if (isValid) {
                        return parsed;
                    }
                }
            } catch (e) { /* ignore */ }
        }
        return getDefaultLayout();
    }

    let draggedIndex = null;

    function renderGrid() {
        const grid = document.getElementById('seatingGrid');
        // Keep the room features, remove only existing desks
        const desks = grid.querySelectorAll('.desk');
        desks.forEach(d => d.remove());

        layout.forEach((desk, index) => {
            const el = document.createElement('div');
            el.className = `desk ${desk.zone} ${desk.pos}`;
            if (!desk.student) el.classList.add('empty-desk');
            el.dataset.index = index;
            el.draggable = true;

            el.innerHTML = `
                <div class="desk-label">${desk.id}</div>
                <div class="student-name">${desk.student || 'Empty'}</div>
            `;

            el.addEventListener('dragstart', (e) => {
                draggedIndex = index;
                el.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', index);
            });

            el.addEventListener('dragend', () => {
                el.classList.remove('dragging');
                document.querySelectorAll('.desk').forEach(d => d.classList.remove('drag-over'));
                draggedIndex = null;
            });

            el.addEventListener('dragover', (e) => {
                e.preventDefault(); 
                if (draggedIndex !== index) {
                    el.classList.add('drag-over');
                }
            });

            el.addEventListener('dragleave', () => {
                el.classList.remove('drag-over');
            });

            el.addEventListener('drop', (e) => {
                e.preventDefault();
                el.classList.remove('drag-over');
                
                if (draggedIndex === null || draggedIndex === index) return;

                // Swap
                const temp = layout[draggedIndex].student;
                layout[draggedIndex].student = layout[index].student;
                layout[index].student = temp;

                // Note: We do NOT save to localStorage here automatically.
                // We only re-render the visual grid.
                renderGrid();
            });

            grid.appendChild(el);
        });
    }

    function init() {
        // Load saved layout (or default)
        layout = loadInitialLayout();
        // Keep a copy of this layout so "Reset" goes back to the last SAVED state
        savedLayout = JSON.parse(JSON.stringify(layout)); 
        renderGrid();

        // --- BUTTON HANDLERS ---
        
        // SET BUTTON: Save current visual layout to localStorage
        document.getElementById('setBtn').addEventListener('click', () => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(layout));
            savedLayout = JSON.parse(JSON.stringify(layout)); // update the rollback point
            alert('Layout saved successfully! It will persist on your next visit.');
        });

        // RESET BUTTON: Revert to the last SAVED state
        document.getElementById('resetBtn').addEventListener('click', () => {
            if (confirm('Discard unsaved changes and revert to the last saved layout?')) {
                layout = JSON.parse(JSON.stringify(savedLayout));
                renderGrid();
            }
        });
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
