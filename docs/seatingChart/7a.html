<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room 2051 · Class 7A Seating Chart</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #eef3f8;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
            overflow: hidden; 
            padding: 1rem;
        }

        .chart-container {
            width: 100%;
            max-width: 1600px;
            height: 100%;
            max-height: 900px;
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 20, 40, 0.1);
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #e2eaf3;
            padding-bottom: 0.75rem;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        h1 {
            font-size: 1.6rem;
            color: #0b2b4a;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .room-badge {
            background: #e3edf7;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            color: #1f4a7a;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        .reset-btn {
            background: white;
            border: 1px solid #b8cee4;
            color: #1f4a7a;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .reset-btn:hover {
            background: #1f4a7a;
            color: white;
        }

        /* The physical room representation */
        .room-layout {
            flex-grow: 1;
            position: relative;
            background: #fafcff;
            border: 2px dashed #d0dfee;
            border-radius: 0.75rem;
            background-image: 
                linear-gradient(#f0f5fa 1px, transparent 1px),
                linear-gradient(90deg, #f0f5fa 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 0;
            overflow: hidden;
        }

        /* Front of room indicator */
        .front-indicator {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            background: #e2eaf3;
            color: #5a7a9a;
            padding: 0.2rem 2rem;
            border-radius: 0 0 10px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 10;
        }

        .desk {
            position: absolute;
            background: white;
            border: 1px solid #b8cee4;
            border-radius: 8px;
            padding: 0.4rem;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: grab;
            user-select: none;
            transition: transform 0.1s, box-shadow 0.1s;
            aspect-ratio: 1.6 / 1;
            /* Base size, will be overridden by specific classes */
            width: 8%; 
            transform: translate(-50%, -50%);
        }

        .desk:active {
            cursor: grabbing;
        }

        .desk.dragging {
            opacity: 0.5;
            transform: translate(-50%, -50%) scale(0.95);
            z-index: 100;
        }

        .desk.drag-over {
            border: 2px dashed #2a6b9e;
            background: #e9f2fc;
            transform: translate(-50%, -50%) scale(1.05);
            z-index: 50;
        }

        .desk-label {
            font-size: 0.5rem;
            color: #6c8199;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 0.1rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .student-name {
            font-weight: 700;
            font-size: 0.8rem;
            color: #1c3a5c;
            line-height: 1.1;
            word-break: break-word;
            width: 100%;
        }

        /* Color Coding Zones */
        .zone-top-left { background: #f0f7ff; border-color: #a8c6e8; }
        .zone-top-right { background: #f4fdf4; border-color: #a8e8b0; }
        .zone-bottom { background: #fffaf0; border-color: #e8d8a8; }
        .zone-middle { background: #fdf4ff; border-color: #d8a8e8; }
        .zone-right-col { background: #f0f4f8; border-color: #b0c0d0; }

        .empty-desk {
            background: #f4f7fa;
            border: 1px dashed #b8cee4;
            color: #9bb1c7;
        }
        
        .empty-desk .student-name {
            color: #9bb1c7;
            font-weight: 500;
            font-style: italic;
            font-size: 0.75rem;
        }

        /* =========================================
           EXACT PHYSICAL POSITIONING (Using % coordinates)
           ========================================= */

        /* --- TOP ROW (10 desks) --- */
        /* The screenshot shows a gap on the far left, then a cluster of 2, then a long row of 8 */
        .top-1  { top: 10%; left: 15%; width: 7%; }
        .top-2  { top: 10%; left: 23%; width: 7%; }
        
        .top-3  { top: 10%; left: 38%; width: 6%; }
        .top-4  { top: 10%; left: 45%; width: 6%; }
        .top-5  { top: 10%; left: 52%; width: 6%; }
        .top-6  { top: 10%; left: 59%; width: 6%; }
        .top-7  { top: 10%; left: 66%; width: 6%; }
        .top-8  { top: 10%; left: 73%; width: 6%; }
        .top-9  { top: 10%; left: 80%; width: 6%; }
        .top-10 { top: 10%; left: 87%; width: 6%; }

        /* --- RIGHT COLUMN (3 desks) --- */
        /* Far right edge, vertically stacked */
        .right-1 { top: 25%; left: 92%; width: 8%; }
        .right-2 { top: 45%; left: 92%; width: 8%; }
        .right-3 { top: 65%; left: 92%; width: 8%; }

        /* --- MIDDLE ISLAND (6 desks: 2 rows of 3) --- */
        /* Centered in the room */
        .mid-1 { top: 35%; left: 42%; width: 8%; }
        .mid-2 { top: 35%; left: 52%; width: 8%; }
        .mid-3 { top: 35%; left: 62%; width: 8%; }
        
        .mid-4 { top: 55%; left: 42%; width: 8%; }
        .mid-5 { top: 55%; left: 52%; width: 8%; }
        .mid-6 { top: 55%; left: 62%; width: 8%; }

        /* --- BOTTOM ROW (11 desks) --- */
        /* Spans the whole width */
        .bot-1  { top: 85%; left: 5%; width: 7%; }
        .bot-2  { top: 85%; left: 13%; width: 7%; }
        .bot-3  { top: 85%; left: 21%; width: 7%; }
        .bot-4  { top: 85%; left: 29%; width: 7%; }
        .bot-5  { top: 85%; left: 37%; width: 7%; }
        .bot-6  { top: 85%; left: 45%; width: 7%; }
        .bot-7  { top: 85%; left: 53%; width: 7%; }
        .bot-8  { top: 85%; left: 61%; width: 7%; }
        .bot-9  { top: 85%; left: 69%; width: 7%; }
        .bot-10 { top: 85%; left: 77%; width: 7%; }
        .bot-11 { top: 85%; left: 85%; width: 7%; }

    </style>
</head>
<body>
<div class="chart-container">
    <header>
        <h1>🍎 Class 7A · Seating Chart</h1>
        <span class="room-badge">🚪 Room 2051</span>
    </header>

    <div class="toolbar">
        <div style="font-weight: 500; color: #4a6a8a;">🖱️ Drag and drop to rearrange</div>
        <button class="reset-btn" id="resetBtn">↻ Reset Layout</button>
    </div>

    <div class="room-layout" id="seatingGrid">
        <div class="front-indicator">Front of Room / Whiteboard</div>
        <!-- Generated via JS -->
    </div>
</div>

<script>
    const RAW_STUDENTS = [
        "Anirudh Anandasundararaman",
        "Batu Boylu",
        "Mila Chen",
        "Charles Dingendorf",
        "Iris Ho",
        "Alisa Hu",
        "Philian Kampmann",
        "Don Li",
        "Liam Langensiepen",
        "Junchi Liu",
        "Felicia Ljungqvist",
        "Kaan Özcan",
        "Mert Öztürk",
        "Kai Penka",
        "Maximilian Schmidt",
        "Mirtó Simiantonakis",
        "Max Sun",
        "Constantin Volberg",
        "Joshua Wagenfeld",
        "Anqing Xiang",
        "Joan Yan",
        "Minghan Ye",
        "Qianyu Zhan",
        "Emma Zhang"
    ];

    // Format Names: First Name + Last Initial
    function formatName(fullName) {
        const parts = fullName.trim().split(/\s+/);
        if (parts.length > 1) {
            return `${parts[0]} ${parts[parts.length - 1][0]}.`;
        }
        return parts[0];
    }

    // Exact physical mapping based on screenshot
    const DESKS = [
        // TOP ROW (10 desks)
        { id: 'ISR-01', pos: 'top-1', zone: 'zone-top-left' },
        { id: 'ISR-02', pos: 'top-2', zone: 'zone-top-left' },
        { id: 'ISR-04', pos: 'top-3', zone: 'zone-top-right' },
        { id: 'ISR-13', pos: 'top-4', zone: 'zone-top-right' },
        { id: 'ISR-06', pos: 'top-5', zone: 'zone-top-right' },
        { id: 'ISR-07', pos: 'top-6', zone: 'zone-top-right' },
        { id: 'ISR-08', pos: 'top-7', zone: 'zone-top-right' },
        { id: 'ISR-09', pos: 'top-8', zone: 'zone-top-right' },
        { id: 'ISR-05', pos: 'top-9', zone: 'zone-top-right' },
        { id: 'ISR-03', pos: 'top-10', zone: 'zone-top-right' },

        // RIGHT COLUMN (3 desks)
        { id: 'ISR-11', pos: 'right-1', zone: 'zone-right-col' },
        { id: 'ISR-12', pos: 'right-2', zone: 'zone-right-col' },
        { id: 'ISR-10', pos: 'right-3', zone: 'zone-right-col' },

        // BOTTOM ROW (11 desks)
        { id: 'ISR-27', pos: 'bot-1', zone: 'zone-bottom' },
        { id: 'ISR-28', pos: 'bot-2', zone: 'zone-bottom' },
        { id: 'ISR-29', pos: 'bot-3', zone: 'zone-bottom' },
        { id: 'ISR-30', pos: 'bot-4', zone: 'zone-bottom' },
        { id: 'ISR-31', pos: 'bot-5', zone: 'zone-bottom' },
        { id: 'ISR-32', pos: 'bot-6', zone: 'zone-bottom' },
        { id: 'ISR-33', pos: 'bot-7', zone: 'zone-bottom' },
        { id: 'ISR-34', pos: 'bot-8', zone: 'zone-bottom' },
        { id: 'ISR-35', pos: 'bot-9', zone: 'zone-bottom' },
        { id: 'ISR-36', pos: 'bot-10', zone: 'zone-bottom' },
        { id: 'ISR-37', pos: 'bot-11', zone: 'zone-bottom' },

        // MIDDLE ISLAND (6 desks)
        { id: 'ISR-40', pos: 'mid-1', zone: 'zone-middle' },
        { id: 'ISR-41', pos: 'mid-2', zone: 'zone-middle' },
        { id: 'ISR-42', pos: 'mid-3', zone: 'zone-middle' },
        { id: 'ISR-43', pos: 'mid-4', zone: 'zone-middle' },
        { id: 'ISR-44', pos: 'mid-5', zone: 'zone-middle' },
        { id: 'ISR-45', pos: 'mid-6', zone: 'zone-middle' },
    ];

    const STORAGE_KEY = 'room2051_seating_v5';

    function getInitialLayout() {
        const names = RAW_STUDENTS.map(formatName);
        const layout = DESKS.map(d => ({ ...d, student: null })); 

        // Fill order: Top (10), Bottom (11), Right (3). Total = 24. 
        // Middle (6) is left empty, as requested.
        const fillOrder = [
            'top-1', 'top-2', 'top-3', 'top-4', 'top-5', 'top-6', 'top-7', 'top-8', 'top-9', 'top-10',
            'bot-1', 'bot-2', 'bot-3', 'bot-4', 'bot-5', 'bot-6', 'bot-7', 'bot-8', 'bot-9', 'bot-10', 'bot-11',
            'right-1', 'right-2', 'right-3',
            'mid-1', 'mid-2', 'mid-3', 'mid-4', 'mid-5', 'mid-6'
        ];

        let nameIndex = 0;
        fillOrder.forEach(pos => {
            if (nameIndex < names.length) {
                const desk = layout.find(d => d.pos === pos);
                if (desk) {
                    desk.student = names[nameIndex];
                    nameIndex++;
                }
            }
        });

        return layout;
    }

    let layout = [];

    function loadLayout() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (parsed.length === DESKS.length) {
                    const isValid = parsed.every((p, i) => p.pos === DESKS[i].pos);
                    if (isValid) {
                        layout = parsed;
                        return;
                    }
                }
            } catch (e) { /* ignore */ }
        }
        layout = getInitialLayout();
        saveLayout();
    }

    function saveLayout() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(layout));
    }

    let draggedIndex = null;

    function renderGrid() {
        const grid = document.getElementById('seatingGrid');
        // Keep the front indicator, remove only desks
        const desks = grid.querySelectorAll('.desk');
        desks.forEach(d => d.remove());

        layout.forEach((desk, index) => {
            const el = document.createElement('div');
            el.className = `desk ${desk.zone} ${desk.pos}`;
            if (!desk.student) el.classList.add('empty-desk');
            el.dataset.index = index;
            el.draggable = true;

            el.innerHTML = `
                <div class="desk-label">${desk.id}</div>
                <div class="student-name">${desk.student || 'Empty'}</div>
            `;

            el.addEventListener('dragstart', (e) => {
                draggedIndex = index;
                el.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', index);
            });

            el.addEventListener('dragend', () => {
                el.classList.remove('dragging');
                document.querySelectorAll('.desk').forEach(d => d.classList.remove('drag-over'));
                draggedIndex = null;
            });

            el.addEventListener('dragover', (e) => {
                e.preventDefault(); 
                if (draggedIndex !== index) {
                    el.classList.add('drag-over');
                }
            });

            el.addEventListener('dragleave', () => {
                el.classList.remove('drag-over');
            });

            el.addEventListener('drop', (e) => {
                e.preventDefault();
                el.classList.remove('drag-over');
                
                if (draggedIndex === null || draggedIndex === index) return;

                // Swap
                const temp = layout[draggedIndex].student;
                layout[draggedIndex].student = layout[index].student;
                layout[index].student = temp;

                saveLayout();
                renderGrid();
            });

            grid.appendChild(el);
        });
    }

    function init() {
        loadLayout();
        renderGrid();

        document.getElementById('resetBtn').addEventListener('click', () => {
            if (confirm('Reset all students to original layout?')) {
                layout = getInitialLayout();
                saveLayout();
                renderGrid();
            }
        });
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
