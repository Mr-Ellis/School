<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room 2051 · Class 7A seating chart</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f4f7fc;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem 3rem;
        }

        .chart-container {
            max-width: 1300px;
            width: 100%;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 15px 35px rgba(0, 20, 40, 0.12);
            padding: 2rem 2rem 2.5rem;
        }

        h1 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem 1.5rem;
            font-weight: 500;
            font-size: 2rem;
            letter-spacing: -0.5px;
            color: #0b2b4a;
            border-bottom: 3px solid #cbdbe9;
            padding-bottom: 1rem;
            margin-bottom: 1.25rem;
        }

        .room-badge {
            background: #e3edf7;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            color: #1f4a7a;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .room-badge i {
            font-size: 1.2rem;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2.5rem;
            background: #eef3fa;
            padding: 0.9rem 1.5rem;
            border-radius: 60px;
        }

        .student-count {
            font-weight: 500;
            color: #1e3a5f;
            background: #ffffffcc;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-size: 0.95rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .reset-btn {
            background: white;
            border: 1px solid #b8cee4;
            color: #1f4a7a;
            padding: 0.5rem 1.4rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .reset-btn:hover {
            background: #1f4a7a;
            border-color: #1f4a7a;
            color: white;
        }

        .reset-btn i {
            font-size: 1.1rem;
        }

        .seating-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem 1.2rem;
            margin: 1.5rem 0 1rem;
        }

        .desk-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 6px 16px rgba(0, 20, 30, 0.08);
            padding: 1rem 0.8rem 0.9rem;
            text-align: center;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            cursor: grab;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(2px);
            border: 1px solid #d9e4f0;
        }

        .desk-card:active {
            cursor: grabbing;
        }

        .desk-card.dragging {
            opacity: 0.5;
            transform: scale(0.97);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            border-color: #8aa9c9;
        }

        .desk-card.drag-over {
            border: 2px dashed #2a6b9e;
            background: #e9f2fc;
            transform: scale(1.02);
        }

        .student-avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            background: #d4e1f0;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
            border: 2px solid white;
            margin-bottom: 0.6rem;
            pointer-events: none;
        }

        .student-name {
            font-weight: 600;
            font-size: 1rem;
            color: #1c3a5c;
            line-height: 1.3;
            word-break: break-word;
            pointer-events: none;
        }

        .student-status {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #d9ecda;
            color: #1c6b2b;
            padding: 0.15rem 0.9rem;
            border-radius: 30px;
            margin-top: 0.4rem;
            font-weight: 600;
            pointer-events: none;
            display: inline-block;
        }

        .empty-desk {
            background: #f9fbfe;
            border: 2px dashed #bdd2e8;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #8ba3bb;
            font-weight: 500;
            min-height: 170px;
            font-size: 0.95rem;
            gap: 0.4rem;
            transition: 0.1s;
            box-shadow: none;
            backdrop-filter: none;
        }

        .empty-desk i {
            font-size: 1.6rem;
            opacity: 0.6;
        }

        .empty-desk.drag-over {
            border: 2px dashed #2a6b9e;
            background: #e2eefb;
            color: #1f4a7a;
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #7189a3;
            text-align: center;
            border-top: 1px solid #dce7f2;
            padding-top: 1.5rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .footer-note span {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* responsive */
        @media (max-width: 850px) {
            .seating-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .seating-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }

            .chart-container {
                padding: 1.5rem 1rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .student-avatar {
                width: 60px;
                height: 60px;
            }

            .toolbar {
                padding: 0.7rem 1rem;
            }
        }

        @media (max-width: 400px) {
            .seating-grid {
                grid-template-columns: 1fr;
            }
        }

        /* icon placeholder (simple unicode) */
        .icon {
            font-style: normal;
        }
    </style>
</head>
<body>
<div class="chart-container">
    <h1>
        <span>🍎 Class 7A · Seating Chart</span>
        <span class="room-badge"><span class="icon">🚪</span> Room 2051</span>
    </h1>

    <div class="toolbar">
        <div class="student-count" id="studentCount">👥 17 students</div>
        <button class="reset-btn" id="resetLayoutBtn">
            <span class="icon">↻</span> Reset layout
        </button>
    </div>

    <!-- Seating grid will be populated by JavaScript -->
    <div class="seating-grid" id="seatingGrid"></div>

    <div class="footer-note">
        <span>🖱️ Drag & drop students to rearrange</span>
        <span>🔄 Changes are saved automatically</span>
        <span>✨ Empty spots are grey</span>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // Student data (from the PDF – 17 students, all present)
    // --------------------------------------------------------------
    const STUDENTS = [
        { name: 'Noé Hauke', avatar: 'https://i.pravatar.cc/150?img=1', status: 'Present' },
        { name: 'Neil Jain', avatar: 'https://i.pravatar.cc/150?img=3', status: 'Present' },
        { name: 'Shuma Kobayashi', avatar: 'https://i.pravatar.cc/150?img=7', status: 'Present' },
        { name: 'Don Li', avatar: 'https://i.pravatar.cc/150?img=12', status: 'Present' },
        { name: 'Jun Nakamura', avatar: 'https://i.pravatar.cc/150?img=25', status: 'Present' },
        { name: 'Riko Nara', avatar: 'https://i.pravatar.cc/150?img=32', status: 'Present' },
        { name: 'Joshua Philips', avatar: 'https://i.pravatar.cc/150?img=41', status: 'Present' },
        { name: 'Vikram Raja', avatar: 'https://i.pravatar.cc/150?img=53', status: 'Present' },
        { name: 'Shogo Sakamoto', avatar: 'https://i.pravatar.cc/150?img=58', status: 'Present' },
        { name: 'Jasper Sroka', avatar: 'https://i.pravatar.cc/150?img=61', status: 'Present' },
        { name: 'Lina Türkyılmaz', avatar: 'https://i.pravatar.cc/150?img=44', status: 'Present' }
    ];

    // We need 17 students, but PDF shows 11 names clearly + maybe others?
    // The extracted images showed: Noé Hauke, Neil Jain, Shuma Kobayashi, Don Li, Jun Nakamura,
    // Riko Nara, Joshua Philips, Vikram Raja, Shogo Sakamoto, Jasper Sroka, Lina Türkyılmaz.
    // That's 11. But PDF also had a blurred section with more? The page 3 shows up to "Lina Türkyılmaz".
    // The class 7a list in the test file might have 17? But we only have 11 names. 
    // I'll generate additional placeholder students to reach 17 to match the "17 students" count 
    // so the grid looks full (like a typical seating chart). If you want only those 11, delete the extras.
    // But for a more complete chart, I'll add 6 generic ones (with generated names) – you can edit them.
    // Actually better to use only the ones from PDF – but we need to fill 17? The PDF shows only 11 unique.
    // The "Present" entries repeated? Let's see: page2 images: Noé, Neil, Shuma, Don, Jun, Riko, Joshua, Vikram.
    // page3: Shogo, Jasper, Lina. That's 11. Possibly there were more on page 2/3 but not captured? 
    // To keep accurate, I'll stick to the 11 and leave 6 empty desks. That's fine – the grid will show empty slots.
    // The user expects a seating chart – empty desks are okay.
    // I'll set total 17 desks (as typical class size) and fill 11, leaving 6 empty. 
    // But the toolbar counts students – we'll show "11 students · 6 empty desks".
    // To be safe, I'll include all 11 distinct students.

    // Fix: Use provided student list (11). However we want 17 total seats. So we create 17 desk slots.
    // We'll store placements in localStorage so students keep positions after reload.

    const TOTAL_DESKS = 17;      // 17 seats in room 2051
    const STORAGE_KEY = 'room2051_seating_v1';

    // Helper to generate a unique ID for each student (use index-based)
    function getStudentId(student, index) {
        return 's' + index + '_' + student.name.replace(/\s/g, '');
    }

    // ---- Build initial layout from students, fill rest with null (empty desk) ----
    function buildInitialLayout() {
        const layout = [];
        // Push each student object with unique id
        STUDENTS.forEach((student, idx) => {
            layout.push({
                id: getStudentId(student, idx),
                name: student.name,
                avatar: student.avatar,
                status: student.status || 'Present'
            });
        });
        // Fill remaining slots with null (empty desk)
        while (layout.length < TOTAL_DESKS) {
            layout.push(null);
        }
        // Shuffle a bit? not needed, but we can distribute so all students are at the top.
        // Already all students first, then empty.
        return layout;
    }

    // Load from localStorage or build initial
    let deskLayout = [];

    function loadLayout() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed) && parsed.length === TOTAL_DESKS) {
                    deskLayout = parsed;
                    return;
                }
            } catch (e) { /* ignore */ }
        }
        // fallback
        deskLayout = buildInitialLayout();
        saveLayout();
    }

    function saveLayout() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(deskLayout));
        updateStudentCount();
    }

    // ---- Render the grid from deskLayout ----
    function renderGrid() {
        const grid = document.getElementById('seatingGrid');
        if (!grid) return;

        grid.innerHTML = '';

        deskLayout.forEach((student, index) => {
            const card = document.createElement('div');
            card.className = 'desk-card';
            card.dataset.index = index;
            card.draggable = true;   // whole card draggable

            if (student) {
                // filled desk
                card.innerHTML = `
                    <img class="student-avatar" src="${student.avatar}" alt="${student.name}" onerror="this.src='https://i.pravatar.cc/150?img=0'">
                    <div class="student-name">${student.name}</div>
                    <div class="student-status">${student.status || 'Present'}</div>
                `;
            } else {
                // empty desk
                card.classList.add('empty-desk');
                card.innerHTML = `<i>🪑</i><span>Empty seat</span>`;
                // empty desks should still be draggable/droppable, but we keep draggable true so we can drag a student onto it
                // but dragging an empty seat is odd – we can set draggable false for empty? But then we can't drag into it?
                // Actually we want to be able to drag a student onto an empty desk. So keep draggable on empty too?
                // But if empty is draggable, user might try to drag empty seat to another seat – that's okay, it will swap.
                // But we need to differentiate empty in data. We'll handle drag events.
                // For consistency, keep draggable true, but empty desk has no student data.
            }

            // Drag events
            card.addEventListener('dragstart', handleDragStart);
            card.addEventListener('dragend', handleDragEnd);
            card.addEventListener('dragover', handleDragOver);
            card.addEventListener('dragleave', handleDragLeave);
            card.addEventListener('drop', handleDrop);

            grid.appendChild(card);
        });

        updateStudentCount();
    }

    // ---- Drag and drop logic ----
    let draggedItemIndex = null;

    function handleDragStart(e) {
        const card = e.currentTarget;
        const index = card.dataset.index;
        if (index === undefined) return;

        draggedItemIndex = parseInt(index, 10);
        // Add dragging class
        card.classList.add('dragging');

        // Set drag data
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', index);
    }

    function handleDragEnd(e) {
        const card = e.currentTarget;
        card.classList.remove('dragging');
        // remove drag-over from all cards
        document.querySelectorAll('.desk-card').forEach(c => c.classList.remove('drag-over'));
        draggedItemIndex = null;
    }

    function handleDragOver(e) {
        e.preventDefault(); // required to allow drop
        e.dataTransfer.dropEffect = 'move';
        const card = e.currentTarget;
        if (!card.classList.contains('dragging')) {
            card.classList.add('drag-over');
        }
    }

    function handleDragLeave(e) {
        const card = e.currentTarget;
        card.classList.remove('drag-over');
    }

    function handleDrop(e) {
        e.preventDefault();
        const targetCard = e.currentTarget;
        const targetIndex = targetCard.dataset.index;

        // remove visual feedback
        document.querySelectorAll('.desk-card').forEach(c => c.classList.remove('drag-over'));

        if (draggedItemIndex === null) return;
        if (targetIndex === undefined) return;

        const fromIdx = draggedItemIndex;
        const toIdx = parseInt(targetIndex, 10);

        if (fromIdx === toIdx) return;

        // Perform swap
        const temp = deskLayout[fromIdx];
        deskLayout[fromIdx] = deskLayout[toIdx];
        deskLayout[toIdx] = temp;

        // Save and re-render
        saveLayout();
        renderGrid();

        // reset drag index
        draggedItemIndex = null;
    }

    // Update the student count / empty desks
    function updateStudentCount() {
        const countEl = document.getElementById('studentCount');
        if (!countEl) return;

        const filled = deskLayout.filter(s => s !== null).length;
        const empty = TOTAL_DESKS - filled;

        if (empty === 0) {
            countEl.innerHTML = `👥 ${filled} students · no empty seats`;
        } else {
            countEl.innerHTML = `👥 ${filled} students · ${empty} empty ${empty === 1 ? 'seat' : 'seats'}`;
        }
    }

    // Reset layout to original (students first, then empty)
    function resetLayout() {
        if (confirm('Reset seating to original order? This will rearrange all students.')) {
            deskLayout = buildInitialLayout();
            saveLayout();
            renderGrid();
        }
    }

    // ---- Initialization ----
    function init() {
        loadLayout();
        renderGrid();

        // Attach reset button
        const resetBtn = document.getElementById('resetLayoutBtn');
        if (resetBtn) {
            resetBtn.addEventListener('click', resetLayout);
        }

        // Optional: handle window resize – nothing needed
    }

    // Run when DOM ready
    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
