<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit 1 · Data Representation</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f0f4fb;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
      padding: 2rem 1.5rem;
      line-height: 1.5;
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; }

    .nav {
      background: #0b2a4a;
      padding: 0.9rem 2rem;
      border-radius: 60px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.8rem;
      margin-bottom: 2.8rem;
      box-shadow: 0 8px 20px rgba(0,20,40,0.08);
    }
    .nav a {
      color: #e6edf5;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .nav a i { font-size: 0.9rem; opacity: 0.7; }
    .nav a:hover { color: #ffffff; text-decoration: underline; text-underline-offset: 4px; }
    .nav .brand {
      margin-right: auto;
      font-weight: 600;
      color: white;
      font-size: 1.1rem;
    }
    .nav .brand i { margin-right: 8px; color: #7bb3ff; }

    /* --- Password Overlay --- */
    .password-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .password-overlay.hidden { display: none; }
    .password-box {
      background: white;
      border-radius: 24px;
      padding: 2.5rem 3rem;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 30px 50px rgba(0,0,0,0.3);
      text-align: center;
    }
    .password-box h2 { color: #0b2a4a; margin-bottom: 0.5rem; font-size: 1.6rem; }
    .password-box p { color: #475569; font-size: 0.95rem; margin-bottom: 1.5rem; }
    .password-box input[type="password"] {
      width: 100%; padding: 0.8rem 1rem; border: 2px solid #d4e0ec; border-radius: 60px;
      font-size: 1rem; margin-bottom: 1rem; outline: none;
    }
    .password-box input[type="password"]:focus { border-color: #1f6390; }
    .password-box .btn {
      background: #1f6390; color: white; border: none; padding: 0.7rem 2rem;
      border-radius: 60px; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    .password-box .btn:hover { background: #134f75; }
    .password-box .error { color: #b13a3a; font-size: 0.85rem; margin-top: 0.5rem; min-height: 1.5rem; }

    .main-title { font-size: 2.8rem; font-weight: 700; color: #0b2a4a; letter-spacing: -0.02em; margin-bottom: 0.2rem; display: flex; align-items: center; gap: 12px; }
    .main-title i { color: #2a6f97; font-size: 2.2rem; }
    .subhead { color: #475569; font-size: 1rem; margin-bottom: 2.5rem; border-left: 4px solid #2a6f97; padding-left: 1.2rem; font-weight: 400; background: #e9eff8; display: inline-block; padding: 0.4rem 1.4rem; border-radius: 40px; }

    .section-head { font-size: 1.9rem; font-weight: 600; color: #0b2a4a; margin: 2.8rem 0 1.5rem 0; padding-bottom: 0.25rem; border-bottom: 4px solid #cbddee; display: flex; align-items: center; gap: 14px; }
    .section-head i { color: #1f6390; font-size: 1.8rem; width: 2.2rem; }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.8rem; margin-top: 0.8rem; }
    .card { background: white; border-radius: 24px; padding: 1.6rem 1.5rem 1.8rem; box-shadow: 0 6px 18px rgba(0, 20, 40, 0.04), 0 1px 3px rgba(0,0,0,0.02); border: 1px solid #e5edf5; transition: 0.2s ease; display: flex; flex-direction: column; }
    .card:hover { border-color: #b6d0e8; box-shadow: 0 12px 28px rgba(0, 32, 64, 0.06); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
    .card-header h4 { font-size: 1.1rem; font-weight: 600; color: #0b2a4a; letter-spacing: -0.2px; line-height: 1.3; }
    .badge { background: #dceaf7; padding: 0.2rem 0.8rem; border-radius: 40px; font-size: 0.65rem; font-weight: 600; color: #13416b; white-space: nowrap; margin-left: 8px; }
    .badge.core { background: #cfe3d0; color: #1d5e3a; }

    .card-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.8rem; align-items: center; border-top: 1px solid #e8eff6; padding-top: 0.9rem; }
    .card-actions .btn { background: #ecf3fa; padding: 0.4rem 1.2rem; border-radius: 30px; font-size: 0.75rem; font-weight: 600; color: #13416b; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; transition: 0.15s; cursor: pointer; }
    .card-actions .btn i { font-size: 0.8rem; }
    .card-actions .btn:hover { background: #d6e4f2; border-color: #b6cfe5; }
    .btn-theory { background: #1a5f87 !important; color: #fff !important; }
    .btn-theory:hover { background: #134f75 !important; }

    .cover-section { margin-top: 0.4rem; padding-top: 0.4rem; border-top: 1px solid #eef2f6; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .cover-section input[type="checkbox"] { width: 18px; height: 18px; accent-color: #0b2a4a; cursor: pointer; }
    .cover-section label { cursor: pointer; font-weight: 500; color: #0b2a4a; }

    .divider-light { margin: 2.2rem 0 0.2rem; border: 0; height: 1px; background: linear-gradient(to right, #d4e0ec, transparent); }

    @media (max-width: 680px) {
      body { padding: 1rem; }
      .nav { flex-direction: column; align-items: flex-start; border-radius: 30px; gap: 0.6rem; }
      .nav .brand { margin-right: 0; }
      .main-title { font-size: 2rem; flex-wrap: wrap; }
      .card-grid { grid-template-columns: 1fr; }
      .password-box { padding: 1.8rem; }
    }
  </style>
</head>
