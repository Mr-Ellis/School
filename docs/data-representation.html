<html lang="en">
<head>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>

  </style>
</head>
<body>

<div class="container">

    <!-- ========== NAVIGATION ========== -->
    <nav class="nav">
        <span class="brand"><i class="fas fa-graduation-cap"></i> IGCSE CompSci</span>
        <a href="../year9.html"><i class="fas fa-arrow-left"></i> Back to Year 9</a>
    </nav>

    <!-- ========== HEADER ========== -->
    <div class="main-title">
        <i class="fas fa-code"></i> Data Representation
    </div>
    <div class="subhead">
        <i class="fas fa-check-circle" style="color:#1f7b4d; margin-right: 6px;"></i> 
        Unit 1 · How computers store and process data
    </div>

    <!-- ========== CONTENT ========== -->
    <div class="section-head">
        <i class="fas fa-calculator"></i> Number Systems
    </div>
    <div class="card-grid">
        <div class="card">
            <div class="card-header">
                <h4>Binary Systems <span class="badge core">Core</span></h4>
            </div>
            <div class="card-actions">
                <a href="#" target="_blank" class="btn btn-theory"><i class="fas fa-book-open"></i> Theory</a>
            </div>
            <div class="cover-section">
                <input type="checkbox" class="cover-checkbox" data-lesson="DR1" id="cover-DR1">
                <label for="cover-DR1">✓ Mark this lesson as covered</label>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h4>Hexadecimal <span class="badge core">Core</span></h4>
            </div>
            <div class="card-actions">
                <a href="#" target="_blank" class="btn btn-theory"><i class="fas fa-book-open"></i> Theory</a>
            </div>
            <div class="cover-section">
                <input type="checkbox" class="cover-checkbox" data-lesson="DR2" id="cover-DR2">
                <label for="cover-DR2">✓ Mark this lesson as covered</label>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h4>Binary Shifts & Two's Complement <span class="badge core">Core</span></h4>
            </div>
            <div class="card-actions">
                <a href="#" target="_blank" class="btn btn-theory"><i class="fas fa-book-open"></i> Theory</a>
            </div>
            <div class="cover-section">
                <input type="checkbox" class="cover-checkbox" data-lesson="DR3" id="cover-DR3">
                <label for="cover-DR3">✓ Mark this lesson as covered</label>
            </div>
        </div>

        <!-- Add more cards for DR4, DR5, etc. as needed -->
    </div>

    <hr class="divider-light">
    <div style="display: flex; justify-content: flex-end; font-size: 0.8rem; color: #5d7f9a; padding: 0.8rem 0;">
        <i class="fas fa-save" style="margin-right: 8px;"></i> progress saved automatically
    </div>
</div>

<script>
    // ========== LESSON COMPLETION CHECKER ==========
    const GRADE_PREFIX = 'igcse_';

    document.querySelectorAll('.cover-checkbox').forEach(function(checkbox) {
        const lessonKey = checkbox.getAttribute('data-lesson');
        const storageKey = GRADE_PREFIX + 'covered_' + lessonKey;
        
        // Load saved state
        if (localStorage.getItem(storageKey) === 'true') {
            checkbox.checked = true;
        }

        // Save state on change
        checkbox.addEventListener('change', function() {
            localStorage.setItem(storageKey, this.checked ? 'true' : 'false');
        });
    });
</script>

</body>
</html>
