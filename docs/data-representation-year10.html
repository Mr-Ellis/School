<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit 1 · Data Representation (Year 10)</title>

    /* --- All your existing styles (keep the same) --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f0f4fb;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
      padding: 2rem 1.5rem;
      line-height: 1.5;
      min-height: 100vh;

    .container { max-width: 1200px; margin: 0 auto; }

    .nav {
      background: #0b2a4a;
      padding: 0.9rem 2rem;
      border-radius: 60px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.8rem;
      margin-bottom: 2.8rem;
      box-shadow: 0 8px 20px rgba(0,20,40,0.08);
    }
    .nav a {
      color: #e6edf5;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .nav a i { font-size: 0.9rem; opacity: 0.7; }
    .nav a:hover { color: #ffffff; text-decoration: underline; text-underline-offset: 4px; }
    .nav .brand {
      margin-right: auto;
      font-weight: 600;
      color: white;
      font-size: 1.1rem;
    }
    .nav .brand i { margin-right: 8px; color: #7bb3ff; }

    .main-title {
      font-size: 2.8rem;
      font-weight: 700;
      color: #0b2a4a;
      letter-spacing: -0.02em;
      margin-bottom: 0.2rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .main-title i { color: #2a6f97; font-size: 2.2rem; }
    .subhead {
      color: #475569;
      font-size: 1rem;
      margin-bottom: 2.5rem;
      border-left: 4px solid #2a6f97;

      font-weight: 400;
      background: #e9eff8;
      display: inline-block;
      padding: 0.4rem 1.4rem;
      border-radius: 40px;
    }

    .section-head {
      font-size: 1.9rem;
      font-weight: 600;
      color: #0b2a4a;
      margin: 2.8rem 0 1.5rem 0;
      padding-bottom: 0.25rem;
      border-bottom: 4px solid #cbddee;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .section-head i { color: #1f6390; font-size: 1.8rem; width: 2.2rem; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.8rem;
      margin-top: 0.8rem;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 1.6rem 1.5rem 1.8rem;
      box-shadow: 0 6px 18px rgba(0, 20, 40, 0.04), 0 1px 3px rgba(0,0,0,0.02);
      border: 1px solid #e5edf5;
      transition: 0.2s ease;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }
    .card:hover {
      border-color: #b6d0e8;
      box-shadow: 0 12px 28px rgba(0, 32, 64, 0.06);
      transform: translateY(-2px);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
    }
    .card-header h4 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #0b2a4a;
      letter-spacing: -0.2px;
      line-height: 1.3;
    }
    .card-header .week-badge {
      background: #dceaf7;
      padding: 0.15rem 0.7rem;
      border-radius: 40px;
      font-size: 0.65rem;
      font-weight: 600;
      color: #13416b;
      white-space: nowrap;
      margin-left: 8px;
    }
    .card p {
      color: #475569;
      font-size: 0.9rem;
      margin: 0.4rem 0 0.6rem 0;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.8rem;
      align-items: center;
      border-top: 1px solid #e8eff6;
      padding-top: 0.9rem;
    }
    .card-actions .btn {
      background: #ecf3fa;
      padding: 0.4rem 1.2rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #13416b;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
      transition: 0.15s;
      cursor: pointer;
      pointer-events: auto;
    }
    .card-actions .btn i { font-size: 0.8rem; }
    .card-actions .btn:hover { background: #d6e4f2; border-color: #b6cfe5; }

    .btn-theory {
      background: #1a5f87 !important;
      color: #fff !important;
    }
    .btn-theory:hover {
      background: #134f75 !important;
    }

    .btn-locked {
      background: #e8dfd0 !important;
      color: #6a4e2e !important;
      cursor: pointer;
    }
    .btn-locked i { color: #b8943e; }

    .cover-section {
      margin-top: 0.4rem;
      padding-top: 0.4rem;
      border-top: 1px solid #eef2f6;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .cover-section input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #0b2a4a;
      cursor: pointer;
    }
    .cover-section label {
      cursor: pointer;
      font-weight: 500;
      color: #0b2a4a;
    }

      font-size: 0.65rem;
      background: #cbd5e1;
      color: #334155;

      text-transform: uppercase;
      letter-spacing: 0.3px;
